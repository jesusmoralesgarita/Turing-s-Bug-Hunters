<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinta Nómada - Contacto</title>
</head>
<body>

    <form id="contact-form" action="https://formspree.io/f/xykblqrv" method="POST">

        <label>Nombre</label>
        <input type="text" name="nombre" placeholder="Nombre" required>

        <label>Apellido</label>
        <input type="text" name="apellido" placeholder="Apellido" required>

        <label>Correo</label>
        <input type="email" name="email" placeholder="ejemplo@tintanomada.com" required>

        <label>Mensaje</label>
        <textarea name="mensaje" placeholder="Ingresa tu mensaje" required></textarea>

        <input type="hidden" name="_subject" value="Nuevo mensaje de Tinta Nómada">

        <button type="submit" id="submit-btn">Enviar</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
