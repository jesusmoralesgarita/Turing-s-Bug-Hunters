<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinta Nómada - Contáctanos</title>
    
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f8f9fa; }
        .form-container { 
            background-color: #ffffff; 
            border-top: 5px solid #0d6efd; 
        }
        .error-mensaje { color: red; font-size: 0.8em; display: none; }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                
                <div class="form-container shadow-lg p-4 rounded">
                    <h2 class="text-center fw-bold mb-4">¡Contactanos!</h2>
                    
                    <!-- Agregamos un ID al formulario para manejarlo con JS -->
                    <form id="contactForm" action="https://formspree.io/f/tu_id_aqui" method="POST">
                        
                        <!-- Nombre -->
                        <div class="mb-3">
                            <label for="name" class="form-label">Nombre completo</label>
                            <input type="text" name="name" class="form-control" id="name" placeholder="Ej. Maitte Vazquez">
                            <div id="errorName" class="error-mensaje">Por favor, ingresa tu nombre.</div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" name="email" class="form-control" id="email" placeholder="nombre@correo.com">
                            <div id="errorEmail" class="error-mensaje">Ingresa un correo electrónico válido.</div>
                        </div>

                        <!-- Teléfono (REQUERIDO EN LA TAREA) -->
                        <div class="mb-3">
                            <label for="phone" class="form-label">Teléfono</label>
                            <input type="tel" name="phone" class="form-control" id="phone" placeholder="Ej. 5512345678">
                            <div id="errorPhone" class="error-mensaje">Ingresa un teléfono válido (10 dígitos).</div>
                        </div>

                        <!-- Mensaje -->
                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Mensaje</label>
                            <textarea name="message" class="form-control" id="mensaje" rows="4" placeholder="Cuéntanos tu idea..."></textarea>
                            <div id="errorMessage" class="error-mensaje">El mensaje no puede estar vacío.</div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg shadow-sm">Enviar Solicitud</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT PARA VALIDACIÓN -->
    <script>
        const form = document.getElementById('contactForm');

        form.addEventListener('submit', function(event) {
            // Detenemos el envío automático para validar primero
            event.preventDefault();

            let esValido = true;

            // Limpiar errores previos
            document.querySelectorAll('.error-mensaje').forEach(el => el.style.display = 'none');

            // Validar Nombre
            const name = document.getElementById('name').value.trim();
            if (name === "") {
                document.getElementById('errorName').style.display = 'block';
                esValido = false;
            }

            // Validar Email (Regex básica)
            const email = document.getElementById('email').value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('errorEmail').style.display = 'block';
                esValido = false;
            }

            // Validar Teléfono (Mínimo 10 dígitos numéricos)
            const phone = document.getElementById('phone').value.trim();
            if (phone.length < 10 || isNaN(phone)) {
                document.getElementById('errorPhone').style.display = 'block';
                esValido = false;
            }

            // Validar Mensaje
            const message = document.getElementById('mensaje').value.trim();
            if (message === "") {
                document.getElementById('errorMessage').style.display = 'block';
                esValido = false;
            }

            // Si todo está correcto, enviamos el formulario
            if (esValido) {
                form.submit(); 
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
